; Vzor verejnej konfigurácie: nikdy nepublikuj skutočný arenti_config.ini.
[camera]
host = 192.168.1.100
port = 8000
username = admin
password = VYPLN_ONVIF_HESLO

[capture]
profile = 0
warmup_seconds = 8
retry_warmup_step_seconds = 4
max_attempts = 3
retry_delay_seconds = 3
jpeg_quality = 2
min_bytes = 20000
min_width = 1280
min_height = 720
min_luma_stddev = 7.0

[ftp]
mode = ftps
host = ftp.example.org
port = 21
username = VYPLN_FTP_MENO
password = VYPLN_FTP_HESLO
; Cesta je relativna ku korenu FTP uctu, nie k verejnej URL.
remote_dir = /public/camera
filename = latest.jpg
allow_plain_ftp = no
allow_nonatomic_replace = no

[storage]
directory = ~/arenti-publisher/data

[monitoring]
; Volitelny Uptime Kuma Push. URL je tajomstvo: do Gitu NEPATRI.
enabled = no
; Sem vloz svoju Push URL z Uptime Kuma (len do sukromneho arenti_config.ini).
push_url =
; Zasielanie cez sukromny ZeroTier IP iba po explicitnom povoleni:
allow_private_http = no
; Len ak reverzny proxy server vyzaduje Host nazov (napr. monitoring:3001):
host_header =
; Pri nedostupnej Uptime Kuma nesmie zlyhat publikovanie JPEG.
timeout_seconds = 3
